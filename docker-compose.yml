services:
  ms-localizacion:
    image: lucianobc/ms-localizacion:latest
    #build: .
    container_name: ms-localizacion
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      DB_HOST: postgres-localizacion
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ms_localizacion
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: sanos_y_salvos_events
      CORS_ORIGIN: '*'
    depends_on:
      postgres-localizacion:
        condition: service_healthy
    networks:
      - db-localizacion-net # Red privada para su BD
      - sanos-y-salvos-net  # Red pública

  postgres-localizacion:
    image: postgis/postgis:16-3.4-alpine
    container_name: postgres-localizacion
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_localizacion
    ports:
      - '5434:5432'
    volumes:
      - pg_localizacion_data:/var/lib/postgresql/data
      # Nota: el esquema lo crea Alembic al arrancar ms-localizacion (ver alembic/env.py).
      # No montar también estos SQL como scripts de init de Postgres — crean la misma
      # tabla dos veces y Alembic falla con "relation already exists" en cada arranque.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-localizacion-net # Solo conectada a la red privada

volumes:
  pg_localizacion_data:

networks:
  sanos-y-salvos-net:
    external: true
    name: mascotas_sanos-y-salvos-net
  db-localizacion-net:
    driver: bridge 
    name: db-localizacion-net # Red local exclusiva para este microservicio